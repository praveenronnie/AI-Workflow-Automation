# Production compose — FormIQ
# Differences from docker-compose.yml (dev):
#   - code is BAKED into images (no .:/app volume mounts)
#   - Caddy terminates TLS (auto Let's Encrypt) and proxies the API
#   - restart policies + logging limits
#   - Postgres port NOT exposed publicly
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Requires .env with production values (JWT_SECRET_KEY, DB_*, R2_*, CORS_ALLOW_ORIGINS)

x-backend-env: &backend-env
  PYTHONPATH: /app
  DB_NAME: ${DB_NAME}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  REDIS_HOST: redis
  VECTOR_DB_URL: http://qdrant:6333
  ENV: production

services:
  caddy:
    image: caddy:2-alpine
    container_name: formiq-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  redis:
    image: redis:7-alpine
    container_name: formiq-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    logging: { options: { max-size: "10m", max-file: "3" } }

  qdrant:
    image: qdrant/qdrant:latest
    container_name: formiq-qdrant
    restart: unless-stopped
    volumes: [qdrant_data:/qdrant/storage]
    logging: { options: { max-size: "10m", max-file: "3" } }

  postgres:
    image: postgres:16-alpine
    container_name: formiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: { options: { max-size: "10m", max-file: "3" } }

  api:
    build: { context: ., dockerfile: Dockerfile }
    container_name: formiq-api
    restart: unless-stopped
    environment:
      <<: *backend-env
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      HF_TOKEN: ${HF_TOKEN}
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    depends_on:
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
    logging: { options: { max-size: "10m", max-file: "5" } }

  worker:
    build: { context: ., dockerfile: Dockerfile }
    container_name: formiq-worker
    restart: unless-stopped
    environment:
      <<: *backend-env
      HF_TOKEN: ${HF_TOKEN}
    command: ["celery", "-A", "backend.celery_app", "worker", "--concurrency=2", "--loglevel=info"]
    depends_on:
      redis: { condition: service_started }
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
    logging: { options: { max-size: "10m", max-file: "5" } }

  beat:
    build: { context: ., dockerfile: Dockerfile }
    container_name: formiq-beat
    restart: unless-stopped
    environment:
      <<: *backend-env
    command: ["celery", "-A", "backend.celery_app", "beat", "--loglevel=info"]
    depends_on: [redis]
    logging: { options: { max-size: "10m", max-file: "3" } }

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
  caddy_data:
  caddy_config:
